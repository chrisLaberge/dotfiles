# Gruvbox Hyprlock Configuration
# Edge-distributed layout with rectangular profile picture
# Focused on terminal beige/grey palette

# Terminal-inspired Color Palette
$bg = rgb(282828)           # dark grey bg
$bg0 = rgb(1d2021)          # darker grey bg
$bg1 = rgb(3c3836)          # medium grey
$bg2 = rgb(504945)          # lighter grey
$fg = rgb(ebdbb2)           # white/cream
$fg2 = rgb(d5c4a1)          # light beige
$fg3 = rgb(bdae93)          # medium beige
$fg4 = rgb(a89984)          # dark beige
$accent = rgb(fabd2f)       # minimal yellow accent
$subtle = rgb(928374)       # muted grey
$fail = rgb(219, 64, 53)
background {
    monitor =
    path = ~/Pictures/wallpapers/gruvbox.png
    color = $bg0
    
    # Blur effect
    blur_passes = 2
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Profile Picture (center) - rectangular
image {
    monitor =
    path = ~/Pictures/Terminal/profile.jpg
    size = 350  # bigger rectangular dimensions
    rounding = 5    # subtle rounded corners
    border_size = 2
    border_color = $fg3
    position = 0, 50
    halign = center
    valign = center
}

# Input field below p
input-field { 
	size = 350, 50
	outline_thickness = 2
	position = 0, -180
	dots_rounding = 4
	font_color = rgba(240,240,240,1.0)
	inner_color = rgba(120,120,120,0.15)
	outer_color = rgba(255,255,255,0.85)
	fail_color = rgba(255,255,255,0.85)
	font_family = Cartograph CF
	placeholder_text =<i>...</i>
	rounding = 12
	check_color = rgba(0,0,5,1)
}
# TOP LEFT - Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $fg
    font_size = 64
    font_family = JetBrainsMono Nerd Font Bold
    position = 50, -50
    halign = left
    valign = top
}

# TOP LEFT - Date (below time)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A")"
    color = $fg2
    font_size = 22
    font_family = JetBrainsMono Nerd Font Medium
    position = 50, -150
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%B %d, %Y")"
    color = $fg3
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 50, -180
    halign = left
    valign = top
}

# TOP RIGHT - Weather
label {
    monitor =
    text = cmd[update:300000] curl -s "wttr.in/?format=1" | head -c -1
    color = $fg2
    font_size = 18
    font_family = JetBrainsMono Nerd Font Medium
    position = -50, -80
    halign = right
    valign = top
}

# TOP RIGHT - Location
label {
    monitor =
    text = Montreal, QC
    color = $fg2
    font_size = 16
    font_family = JetBrainsMono Nerd Font Medium
    position = -50, -50
    halign = right
    valign = top
}


# Caps Lock indicator
label {
    monitor =
    text = cmd[update:1000] echo "$([ $(cat /sys/class/leds/input*::capslock/brightness 2>/dev/null) = "1" ] && echo "CAPS LOCK" || echo "")"
    color = $accent
    font_size = 11
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 120
    halign = center
    valign = bottom
}
